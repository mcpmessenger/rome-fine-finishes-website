steps:
- name: "gcr.io/cloud-builders/docker"
  args:
    - "build"
    - "--no-cache"
    - "-t"
    - "us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/rome-fine-finishes-website/rome:$SHORT_SHA"
    - "-t"
    - "us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/rome-fine-finishes-website/rome:latest"
    - "-f"
    - "Dockerfile"
    - "."
- name: "gcr.io/cloud-builders/docker"
  args:
    - "push"
    - "--all-tags"
    - "us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/rome-fine-finishes-website/rome"
- name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
  entrypoint: gcloud
  args:
    - "run"
    - "deploy"
    - "rome"
    - "--image"
    - "us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/rome-fine-finishes-website/rome:latest"
    - "--region"
    - "us-central1"
    - "--platform"
    - "managed"
    - "--allow-unauthenticated"
images:
- "us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/rome-fine-finishes-website/rome:$SHORT_SHA"
- "us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/rome-fine-finishes-website/rome:latest"
